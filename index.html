<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Rotina da Ana</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rotina Ana">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fdf3f8">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f3a6c1'/%3E%3Ctext x='50' y='66' font-size='58' text-anchor='middle'%3E%F0%9F%8D%BC%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f3a6c1'/%3E%3Ctext x='50' y='66' font-size='58' text-anchor='middle'%3E%F0%9F%8D%BC%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{
  --pink:#f3a6c1; --pink-light:#fdf3f8; --blue:#a6c8f3; --mint:#a6e3d0; --amber:#f3d9a6;
  --ink:#3a2e35; --muted:#8a7a83; --card:#ffffff; --bg:#fdf5f8;
  --danger:#e57373; --good:#5aab8c; --shadow:0 2px 10px rgba(60,30,45,0.08);
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#f3e9ee; --muted:#b7a6b0; --card:#2a2029; --bg:#1c1620; --pink-light:#3a2733; }
}
:root.force-dark{ --ink:#f3e9ee; --muted:#b7a6b0; --card:#2a2029; --bg:#1c1620; --pink-light:#3a2733; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom)); min-height:100vh;}
h1,h2,h3{margin:0 0 4px;}
button{font-family:inherit;}
.hidden{display:none !important;}
#app{max-width:560px;margin:0 auto;padding:16px 16px 4px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 8px;}
.topbar h1{font-size:22px;}
.topbar .age{color:var(--muted);font-size:13px;}
.topbar .right{display:flex;align-items:center;gap:8px;}
.sync-dot{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.sync-dot .d{width:7px;height:7px;border-radius:50%;background:var(--good);}
.sync-dot.syncing .d{background:var(--amber);}
.gear{background:none;border:none;font-size:22px;cursor:pointer;padding:8px;}
.streak-badge{display:inline-flex;align-items:center;gap:5px;background:var(--pink-light);color:var(--pink);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;margin-bottom:10px;}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
.card h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600;}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.status-item{background:var(--pink-light);border-radius:14px;padding:12px;}
.status-item .label{font-size:12px;color:var(--muted);}
.status-item .value{font-size:16px;font-weight:700;margin-top:2px;}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.quick-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--card);border:none;border-radius:var(--radius);padding:20px 8px;box-shadow:var(--shadow);font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;}
.quick-btn .emoji{font-size:30px;}
.quick-btn.active{background:linear-gradient(135deg,var(--pink),var(--blue));color:#fff;}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mini-btn{display:flex;align-items:center;gap:8px;background:var(--pink-light);border:none;border-radius:14px;padding:12px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;}
.mini-btn .emoji{font-size:20px;}
.timeline-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.05);}
.timeline-item:last-child{border-bottom:none;}
.timeline-item .icon{font-size:22px;width:34px;text-align:center;}
.timeline-item .info{flex:1;}
.timeline-item .info .title{font-weight:600;font-size:14px;}
.timeline-item .info .sub{font-size:12px;color:var(--muted);}
.timeline-item .who{display:inline-block;font-size:10px;font-weight:700;color:var(--pink);background:var(--pink-light);border-radius:8px;padding:1px 6px;margin-left:6px;}
.timeline-item .del{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;padding:4px 8px;}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);box-shadow:0 -2px 10px rgba(0,0,0,.06);padding:6px 2px calc(6px + env(safe-area-inset-bottom));z-index:20;}
.tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;color:var(--muted);padding:5px 1px;cursor:pointer;}
.tab .emoji{font-size:19px;}
.tab.active{color:var(--pink);}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end;}
.sheet{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;position:relative;}
.sheet h2{font-size:18px;margin-bottom:14px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid rgba(0,0,0,.12);background:var(--bg);color:var(--ink);font-size:15px;font-family:inherit;}
.field textarea{resize:vertical;min-height:60px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;}
.opt-btn{flex:1;min-width:80px;padding:12px 8px;border-radius:12px;border:2px solid rgba(0,0,0,.08);background:var(--bg);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;}
.opt-btn.selected{border-color:var(--pink);background:var(--pink-light);}
.btn{width:100%;padding:14px;border-radius:14px;border:none;background:var(--pink);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;}
.btn.secondary{background:var(--bg);color:var(--ink);border:1px solid rgba(0,0,0,.1);}
.btn.danger{background:var(--danger);}
.btn.small{width:auto;padding:8px 14px;font-size:13px;margin-top:0;}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;}
.big-timer{text-align:center;padding:20px 0;}
.big-timer .t{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;}
.big-timer .l{color:var(--muted);font-size:13px;margin-top:2px;}
.leap-card{border-radius:16px;padding:16px;background:linear-gradient(135deg,var(--mint),var(--blue));color:#1c2e2a;margin-bottom:14px;}
.leap-card h3{color:#1c2e2a;opacity:.75;}
.leap-list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.05);}
.leap-list-item:last-child{border-bottom:none;}
.leap-list-item .dot{width:10px;height:10px;border-radius:50%;background:#ccc;flex-shrink:0;}
.leap-list-item.past .dot{background:var(--mint);}
.leap-list-item.current .dot{background:var(--pink);}
.leap-list-item .txt{flex:1;}
.leap-list-item .txt .t1{font-weight:600;font-size:14px;}
.leap-list-item .txt .t2{font-size:12px;color:var(--muted);}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--pink-light);color:var(--pink);}
.date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.date-nav button{background:var(--card);border:none;box-shadow:var(--shadow);border-radius:10px;padding:8px 14px;font-size:16px;cursor:pointer;}
.date-nav .d{font-weight:700;font-size:15px;}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px;}
.tip{background:var(--pink-light);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;margin-top:10px;}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
.subtab{flex-shrink:0;background:var(--card);border:none;box-shadow:var(--shadow);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;}
.subtab.active{background:var(--pink);color:#fff;}
.chart-wrap{position:relative;height:180px;margin-top:10px;}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.05);gap:10px;}
.list-row:last-child{border-bottom:none;}
.list-row .t1{font-weight:600;font-size:14px;}
.list-row .t2{font-size:12px;color:var(--muted);}
.vac-suggest{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed rgba(0,0,0,.08);gap:8px;}
.vac-suggest:last-child{border-bottom:none;}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:13px;display:flex;align-items:center;gap:12px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.25);}
.toast button{background:none;border:none;color:var(--pink);font-weight:700;font-size:13px;cursor:pointer;}
.photo-thumb{width:100%;max-height:140px;object-fit:cover;border-radius:12px;margin-top:8px;}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.day-timeline{position:relative;height:34px;background:var(--pink-light);border-radius:10px;margin-top:4px;overflow:hidden;}
.day-timeline .seg{position:absolute;top:6px;height:22px;border-radius:6px;}
.day-timeline .tick{position:absolute;top:0;bottom:0;width:2px;}
.day-timeline-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px;}
.mood-row{display:flex;gap:8px;justify-content:space-between;margin-top:8px;}
.mood-btn{flex:1;background:var(--bg);border:2px solid transparent;border-radius:12px;padding:10px 4px;font-size:22px;cursor:pointer;}
.mood-btn.selected{border-color:var(--pink);background:var(--pink-light);}
.insight-row{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:6px;}
.insight-up{color:var(--good);font-weight:700;}
.insight-down{color:var(--danger);font-weight:700;}
.leap-calib{display:flex;gap:8px;margin-top:10px;}
</style>
</head>
<body>

<div id="onboarding" class="center-screen hidden">
  <div class="card" style="width:100%;max-width:400px;">
    <h2 style="font-size:20px;">👶 Vamos começar!</h2>
    <p style="color:var(--muted);font-size:14px;margin-top:4px;">Cadastre o bebê pra começar a registrar a rotina.</p>
    <div class="field" style="margin-top:16px;">
      <label>Nome do bebê</label>
      <input type="text" id="ob-name" placeholder="Ana" value="Ana">
    </div>
    <div class="field">
      <label>Data de nascimento</label>
      <input type="date" id="ob-birth">
    </div>
    <div class="field">
      <label>Semanas de gestação ao nascer (opcional, só se prematura)</label>
      <input type="number" id="ob-gestweeks" placeholder="ex: 34" min="20" max="42">
    </div>
    <div class="field">
      <label>Quem é você?</label>
      <div class="opt-row" id="ob-who">
        <button type="button" class="opt-btn selected" data-v="Mamãe">🤱 Mamãe</button>
        <button type="button" class="opt-btn" data-v="Papai">👨 Papai</button>
      </div>
    </div>
    <button class="btn" id="ob-save">Começar a usar</button>
  </div>
</div>

<div id="app" class="hidden">

  <div class="topbar">
    <div>
      <h1 id="baby-name">Ana</h1>
      <div class="age" id="baby-age">—</div>
    </div>
    <div class="right">
      <div class="sync-dot" id="sync-dot"><span class="d"></span><span id="sync-label">sincronizado</span></div>
      <button class="gear" id="open-settings">⚙️</button>
    </div>
  </div>

  <!-- HOME -->
  <div id="tab-home" class="tabcontent">
    <div id="streak-wrap"></div>
    <div class="card" id="live-status-card"></div>
    <div class="card" id="mood-card"></div>

    <div class="card">
      <h3>Registrar agora</h3>
      <div class="quick-grid">
        <button class="quick-btn" data-action="fralda"><span class="emoji">🧷</span>Fralda</button>
        <button class="quick-btn" data-action="sono"><span class="emoji">😴</span>Sono</button>
        <button class="quick-btn" data-action="mamada"><span class="emoji">🍼</span>Mamada</button>
        <button class="quick-btn" data-action="atividade"><span class="emoji">🧸</span>Atividade</button>
      </div>
    </div>

    <div class="card">
      <h3>Últimos registros</h3>
      <div id="recent-list"></div>
    </div>
  </div>

  <!-- HISTORICO -->
  <div id="tab-historico" class="tabcontent hidden">
    <div class="date-nav">
      <button id="hist-prev">‹</button>
      <div class="d" id="hist-date-label">Hoje</div>
      <button id="hist-next">›</button>
    </div>
    <div class="card">
      <div id="hist-timeline"></div>
      <div id="hist-list"></div>
    </div>
    <button class="btn secondary" id="btn-handover">🤝 Resumo pra passar o plantão</button>
    <div style="display:flex;gap:10px;">
      <button class="btn secondary" style="margin-top:0;" id="btn-export-pdf">📄 PDF pro pediatra</button>
      <button class="btn secondary" style="margin-top:0;" id="btn-export-csv">📊 Exportar CSV</button>
    </div>
  </div>

  <!-- SONO -->
  <div id="tab-sono" class="tabcontent hidden">
    <div class="card" id="sono-window-card"></div>
    <div class="card" id="sono-total-card"></div>
    <div class="card">
      <h3>Tendência dos últimos 7 dias</h3>
      <div class="chart-wrap"><canvas id="sono-trend-chart"></canvas></div>
    </div>
    <div class="card">
      <h3>Sonos de hoje</h3>
      <div id="sono-today-list"></div>
    </div>
  </div>

  <!-- SAUDE -->
  <div id="tab-saude" class="tabcontent hidden">
    <div class="subtabs" id="saude-subtabs">
      <button class="subtab active" data-sub="crescimento">📈 Crescimento</button>
      <button class="subtab" data-sub="vacinas">💉 Vacinas</button>
      <button class="subtab" data-sub="remedios">💊 Remédios</button>
      <button class="subtab" data-sub="ordenha">🍼 Ordenha</button>
      <button class="subtab" data-sub="consultas">📅 Consultas</button>
    </div>
    <div id="saude-content"></div>
  </div>

  <!-- DESENVOLVIMENTO -->
  <div id="tab-dev" class="tabcontent hidden">
    <div id="leap-current-card"></div>
    <div class="card">
      <h3>Atividades sugeridas pro momento</h3>
      <div id="leap-activities"></div>
    </div>
    <div class="card">
      <h3>Anotações sobre o salto atual</h3>
      <div id="leap-notes-list"></div>
      <textarea id="leap-note-input" placeholder="Como ela está reagindo a essa fase?" style="width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid rgba(0,0,0,.12);background:var(--bg);color:var(--ink);min-height:50px;"></textarea>
      <button class="btn" id="leap-note-save">Salvar anotação</button>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="margin:0;">Marcos e conquistas</h3>
        <button class="btn small" id="btn-add-milestone">+ Adicionar</button>
      </div>
      <div id="milestones-list"></div>
    </div>
    <div class="card">
      <h3>Linha do tempo dos saltos</h3>
      <div id="leap-list"></div>
    </div>
  </div>

</div>

<div class="tabbar hidden" id="tabbar">
  <button class="tab active" data-tab="home"><span class="emoji">🏠</span>Início</button>
  <button class="tab" data-tab="historico"><span class="emoji">📋</span>Histórico</button>
  <button class="tab" data-tab="sono"><span class="emoji">😴</span>Sono</button>
  <button class="tab" data-tab="saude"><span class="emoji">💉</span>Saúde</button>
  <button class="tab" data-tab="dev"><span class="emoji">🌱</span>Salto</button>
</div>

<div id="sheet-root"></div>
<div id="toast-root"></div>

<script>
const SUPABASE_URL = "https://mujljhojmxffmqmijvhb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11amxqaG9qbXhmZm1xbWlqdmhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTU1NzIsImV4cCI6MjEwMjA3MTU3Mn0.i1xQ-73xP7-GFxZ7im1Cs5OjsUXb01BhIO6mfmdwmhE";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let baby = null;
let state = {
  diapers: [], sleeps: [], feedings: [], activities: [],
  growth: [], milestones: [], vaccinations: [], medications: [], pumpings: [], milkStash: [], leapNotes: [],
  appointments: [], moods: [],
  histDate: new Date(),
  activeTab: 'home',
  activeSaudeSub: 'crescimento',
  liveTick: null,
  sonoChart: null,
};

// ---------- helpers ----------
const $ = sel => document.querySelector(sel);
const pad = n => String(n).padStart(2,'0');
function fmtTime(d){ d=new Date(d); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDateInput(d){ d=new Date(d); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDateLabel(d){
  const today = new Date(); today.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const diff = Math.round((today-dd)/86400000);
  if(diff===0) return 'Hoje';
  if(diff===1) return 'Ontem';
  return dd.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function dayRange(d){
  const start = new Date(d); start.setHours(0,0,0,0);
  const end = new Date(d); end.setHours(23,59,59,999);
  return [start.toISOString(), end.toISOString()];
}
function minsBetween(a,b){ return Math.round((new Date(b)-new Date(a))/60000); }
function fmtDur(mins){
  if(mins==null || isNaN(mins)) return '—';
  mins = Math.max(0,Math.round(mins));
  const h = Math.floor(mins/60), m = mins%60;
  if(h>0) return h+'h'+pad(m)+'m';
  return m+'min';
}
function timeAgo(d){
  const mins = minsBetween(d, new Date());
  if(mins<1) return 'agora mesmo';
  if(mins<60) return 'há '+mins+' min';
  const h = Math.floor(mins/60);
  if(h<24) return 'há '+h+'h'+(mins%60?pad(mins%60)+'m':'');
  return 'há '+Math.floor(h/24)+' dia(s)';
}
function ageInfo(birthDate){
  const now = new Date();
  const b = new Date(birthDate+'T00:00:00');
  const days = Math.floor((now-b)/86400000);
  const weeks = Math.floor(days/7);
  const months = Math.floor(days/30.44);
  const remDays = Math.floor(days - months*30.44);
  return {days, weeks, months, remDays,
    label: months<1 ? `${weeks} semana(s) de vida` : `${months} ${months===1?'mês':'meses'} e ${remDays} dia(s)`};
}
function correctedAgeInfo(){
  if(!baby.gestational_weeks_at_birth || baby.gestational_weeks_at_birth>=37) return null;
  const correctionDays = (40-baby.gestational_weeks_at_birth)*7;
  const adjBirth = new Date(new Date(baby.birth_date+'T00:00:00').getTime()+correctionDays*86400000);
  return ageInfo(fmtDateInput(adjBirth));
}
function caregiver(){ return localStorage.getItem('caregiverName') || 'Alguém'; }
function closeSheet(){ $('#sheet-root').innerHTML=''; }
function showToast(message, undoFn){
  const root = $('#toast-root');
  root.innerHTML = `<div class="toast">${message} ${undoFn?'<button id="toast-undo">Desfazer</button>':''}</div>`;
  if(undoFn) $('#toast-undo').onclick = ()=>{ root.innerHTML=''; undoFn(); };
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ root.innerHTML=''; }, 5000);
}
function setSyncing(on){
  const dot = $('#sync-dot');
  if(!dot) return;
  dot.classList.toggle('syncing', on);

// ---------- streak ----------
function computeStreak(){
  const days = new Set();
  allEventsSorted().forEach(it=> days.add(fmtDateInput(it.time)));
  let streak = 0;
  let cursor = new Date();
  while(days.has(fmtDateInput(cursor))){ streak++; cursor = new Date(cursor.getTime()-86400000); }
  return streak;
}

function whoTag(logged_by){ return logged_by ? `<span class="who">${logged_by}</span>` : ''; }

function allEventsSorted(){
  const items = [];
  state.diapers.forEach(d=>items.push({kind:'diaper',time:d.occurred_at,data:d}));

  state.activities.forEach(a=>items.push({kind:'activity',time:a.occurred_at,data:a}));
  items.sort((a,b)=> new Date(b.time)-new Date(a.time));

function renderTimelineItem(it){

  let icon='📝', title='', sub='';
  if(it.kind==='diaper'){ icon = d.type==='coco'?'💩':(d.type==='ambos'?'🧷':'💧'); title = 'Fralda — '+diaperLabel(d.type); const extras=[]; if(d.consistency) extras.push(d.consistency); if(d.color) extras.push(d.color); sub = fmtTime(d.occurred_at) + (extras.length?' · '+extras.join(', '):'') + (d.notes?' · '+d.notes:''); }
  else if(it.kind==='sleep'){ icon='😴'; title = (d.type==='noite'?'Sono (noite)':'Soneca') + (d.end_time?'':' — em andamento'); const dur = d.end_time?minsBetween(d.start_time,d.end_time):minsBetween(d.start_time,new Date()); const interr = (d.interruptions||[]).length; sub = fmtTime(d.start_time)+(d.end_time?' – '+fmtTime(d.end_time):'')+' · '+fmtDur(dur)+(interr?' · '+interr+' interrup.':''); }
  else if(it.kind==='feeding'){ icon='🍼'; title = 'Mamada — '+feedLabel(d.type); const parts=[]; if(d.duration_minutes) parts.push(fmtDur(d.duration_minutes)); if(d.amount_ml) parts.push(d.amount_ml+'ml'); sub = fmtTime(d.start_time)+(parts.length?' · '+parts.join(' · '):'')+(d.notes?' · '+d.notes:''); }
  else if(it.kind==='activity'){ icon='🧸'; title = d.description; sub = fmtTime(d.occurred_at)+(d.notes?' · '+d.notes:''); }
  return `<div class="timeline-item" data-kind="${it.kind}" data-id="${d.id}">
    <div class="icon">${icon}</div>
    <div class="info"><div class="title">${title}${whoTag(d.logged_by)}</div><div class="sub">${sub}</div></div>

function renderDayTimeline(date, start, end){
  const dayStart = new Date(start).getTime();
  const dayLen = 24*3600*1000;
  const pct = ms => Math.min(100, Math.max(0, (ms-dayStart)/dayLen*100));
  let segs = '';
  state.sleeps.filter(s=>s.start_time<end && (s.end_time||new Date().toISOString())>start).forEach(s=>{
    const from = pct(new Date(s.start_time).getTime());
    const to = pct(new Date(s.end_time||new Date()).getTime());
    segs += `<div class="seg" style="left:${from}%;width:${Math.max(0.6,to-from)}%;background:var(--blue);" title="Sono"></div>`;
  });
  state.feedings.filter(f=>f.start_time>=start && f.start_time<=end).forEach(f=>{
    const p = pct(new Date(f.start_time).getTime());
    segs += `<div class="tick" style="left:${p}%;background:var(--pink);" title="Mamada"></div>`;
  });
  state.diapers.filter(d=>d.occurred_at>=start && d.occurred_at<=end).forEach(d=>{
    const p = pct(new Date(d.occurred_at).getTime());
    segs += `<div class="tick" style="left:${p}%;background:var(--amber);" title="Fralda"></div>`;
  });
  $('#hist-timeline').innerHTML = `<div class="day-timeline">${segs}</div>
    <div class="day-timeline-labels"><span>00h</span><span>06h</span><span>12h</span><span>18h</span><span>24h</span></div>
    <div class="tip" style="margin-top:8px;font-size:11px;"><span style="color:var(--blue);">■</span> sono &nbsp; <span style="color:var(--pink);">●</span> mamada &nbsp; <span style="color:var(--amber);">●</span> fralda</div>`;
}

 {maxWeeks:4, label:'0–1 mês', wakeMin:45, wakeMax:60, sleepMin:14*60, sleepMax:17*60, naps:'4–5'},

 {maxWeeks:52, label:'9–12 meses', wakeMin:180, wakeMax:240, sleepMin:12*60, sleepMax:14*60, naps:'2'},
 {maxWeeks:78, label:'12–18 meses', wakeMin:240, wakeMax:360, sleepMin:11*60, sleepMax:14*60, naps:'1–2'},
 {maxWeeks:9999, label:'18–24 meses', wakeMin:300, wakeMax:360, sleepMin:11*60, sleepMax:14*60, naps:'1'},
];
function currentWakeWindow(){
  const weeks = ageInfo(baby.birth_date).weeks;
  return WAKE_WINDOWS.find(w=>weeks<=w.maxWeeks) || WAKE_WINDOWS[WAKE_WINDOWS.length-1];
}
function baseWakeWindow(){
  const ww = currentWakeWindow();
  if(baby.wake_window_override_min && baby.wake_window_override_max){
    return {...ww, wakeMin:baby.wake_window_override_min, wakeMax:baby.wake_window_override_max, label:ww.label+' · ajuste manual'};
  }
  return ww;
}
// Adaptive: blend age-table (or manual override) midpoint with rolling average of Ana's real awake-time-before-sleep (like a simplified SweetSpot)
function adaptiveWakeWindow(){
  const ww = baseWakeWindow();
  const finished = state.sleeps.filter(s=>s.end_time).sort((a,b)=> new Date(a.start_time)-new Date(b.start_time));
  const gaps = [];
  for(let i=1;i<finished.length;i++){
    const gap = minsBetween(finished[i-1].end_time, finished[i].start_time);
    if(gap>15 && gap<600) gaps.push(gap);
  }
  const last7 = gaps.slice(-7);
  if(last7.length<3) return {min:ww.wakeMin, max:ww.wakeMax, adaptive:false, label:ww.label, sleepMin:ww.sleepMin, sleepMax:ww.sleepMax, naps:ww.naps};
  const avg = last7.reduce((a,b)=>a+b,0)/last7.length;
  const blended = Math.round((avg + (ww.wakeMin+ww.wakeMax)/2)/2);
  const min = Math.max(ww.wakeMin*0.7, blended-15);
  const max = Math.min(ww.wakeMax*1.3, blended+15);
  return {min:Math.round(min), max:Math.round(max), adaptive:true, label:ww.label, sleepMin:ww.sleepMin, sleepMax:ww.sleepMax, naps:ww.naps};
}

    ${totalMin < ww.sleepMin ? '<div class="tip">Ana está abaixo do recomendado até agora — de olho nas próximas janelas de sono pra compensar.</div>' : ''}`;

  $('#sono-today-list').innerHTML = todays.length ? todays.map(s=>renderTimelineItem({kind:'sleep',time:s.start_time,data:s})).join('') : '<div class="empty">Nenhum sono registrado hoje</div>';
  attachDeleteHandlers('#sono-today-list');

function totalSleepBetween(daysAgoStart, daysAgoEnd){
  const start = new Date(Date.now()-daysAgoStart*86400000).toISOString();
  const end = new Date(Date.now()-daysAgoEnd*86400000).toISOString();
  return state.sleeps.filter(s=>s.start_time>=end && s.start_time<start)
    .reduce((sum,s)=> sum+minsBetween(s.start_time, s.end_time||new Date()), 0);
}
function renderWeeklyInsight(){
  const thisWeek = totalSleepBetween(7,0);
  const lastWeek = totalSleepBetween(14,7);
  let html = '';
  if(lastWeek>=60){
    const diff = Math.round((thisWeek-lastWeek)/lastWeek*100);
    if(Math.abs(diff)>=3){
      html = `<div class="insight-row">${diff>0?'<span class="insight-up">▲</span>':'<span class="insight-down">▼</span>'} Essa semana ela dormiu <b>${Math.abs(diff)}% ${diff>0?'a mais':'a menos'}</b> que a semana passada (${fmtDur(thisWeek)} vs ${fmtDur(lastWeek)}).</div>`;
    }
  }
  const totalCard = $('#sono-total-card');
  if(html) totalCard.insertAdjacentHTML('beforeend', html);
}

function renderSonoTrendChart(){
  const canvas = $('#sono-trend-chart');
  if(!canvas || typeof Chart==='undefined') return;
  const days = [];
  for(let i=6;i>=0;i--) days.push(new Date(Date.now()-i*86400000));
  const totals = days.map(d=>{
    const [s,e] = dayRange(d);
    return state.sleeps.filter(sl=>sl.start_time>=s && sl.start_time<=e)
      .reduce((sum,sl)=> sum + minsBetween(sl.start_time, sl.end_time||new Date()), 0)/60;
  });
  const labels = days.map(d=> d.toLocaleDateString('pt-BR',{weekday:'short'}));
  if(state.sonoChart) state.sonoChart.destroy();
  const isDark = document.documentElement.classList.contains('force-dark') || matchMedia('(prefers-color-scheme: dark)').matches;
  state.sonoChart = new Chart(canvas.getContext('2d'), {
    type:'bar',
    data:{ labels, datasets:[{ label:'Horas dormidas', data: totals, backgroundColor:'#f3a6c1', borderRadius:6 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{ y:{ beginAtZero:true, ticks:{color:isDark?'#b7a6b0':'#8a7a83'}, grid:{color:isDark?'#3a2733':'#f0e0e8'} }, x:{ ticks:{color:isDark?'#b7a6b0':'#8a7a83'}, grid:{display:false} } }
    }
  });
}

const WHO_MEDIAN_GIRLS = {
  weightKg: {0:3.2,1:4.2,2:5.1,3:5.8,4:6.4,5:6.9,6:7.3,7:7.6,8:7.9,9:8.2,10:8.5,11:8.7,12:8.9,15:9.6,18:10.2,21:10.9,24:11.5},
  heightCm: {0:49.1,1:53.7,2:57.1,3:59.8,4:62.1,5:64.0,6:65.7,7:67.3,8:68.7,9:70.1,10:71.5,11:72.8,12:74.0,15:77.5,18:80.7,21:83.7,24:86.4},
};
function whoMedianAt(months, kind){
  const table = WHO_MEDIAN_GIRLS[kind];
  const keys = Object.keys(table).map(Number).sort((a,b)=>a-b);
  if(months<=keys[0]) return table[keys[0]];
  if(months>=keys[keys.length-1]) return table[keys[keys.length-1]];
  for(let i=0;i<keys.length-1;i++){
    if(months>=keys[i] && months<=keys[i+1]){
      const t=(months-keys[i])/(keys[i+1]-keys[i]);
      return table[keys[i]] + t*(table[keys[i+1]]-table[keys[i]]);
    }
  }
  return null;
}

let growthCharts = {};
function drawGrowthChart(canvasId, points, whoKind, color){
  const canvas = document.getElementById(canvasId);
  if(!canvas || typeof Chart==='undefined') return;
  if(growthCharts[canvasId]) growthCharts[canvasId].destroy();
  const labels = points.map(p=>new Date(p.x+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}));
  const whoLine = points.map(p=>{
    const months = ageInfo(baby.birth_date).days ? Math.floor((new Date(p.x)-new Date(baby.birth_date+'T00:00:00'))/86400000/30.44) : 0;
    return whoMedianAt(Math.max(0,months), whoKind);
  });
  const isDark = document.documentElement.classList.contains('force-dark') || matchMedia('(prefers-color-scheme: dark)').matches;
  growthCharts[canvasId] = new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels, datasets:[
      { label:'Ana', data: points.map(p=>p.y), borderColor:color, backgroundColor:color, tension:.3 },
      { label:'Mediana OMS', data: whoLine, borderColor:isDark?'#666':'#ccc', borderDash:[5,5], pointRadius:0 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{labels:{color:isDark?'#b7a6b0':'#8a7a83', font:{size:10}}} },
      scales:{ y:{ ticks:{color:isDark?'#b7a6b0':'#8a7a83'}, grid:{color:isDark?'#3a2733':'#f0e0e8'} }, x:{ ticks:{color:isDark?'#b7a6b0':'#8a7a83'}, grid:{display:false} } }
    }
  });
}

function leapDate(w){ const b=new Date(baby.birth_date+'T00:00:00'); return new Date(b.getTime()+w*7*86400000); }

function renderDev(){
  const nowDays = ageInfo(baby.birth_date).days - (baby.leap_calibration_days||0);
  let current=null, next=null;
  LEAPS.forEach(l=>{
    const fussyStartDay = (l.week*7)-9, calmDay = l.week*7+5;
    if(nowDays>=fussyStartDay && nowDays<=calmDay) current=l;
    if(!next && l.week*7 > nowDays) next=l;
  });
  const curCard = $('#leap-current-card');
  const showLeap = current || next;
  if(current){
    curCard.innerHTML = `<div class="leap-card"><span class="pill" style="background:rgba(255,255,255,.5);">Salto ${current.n} · possível fase mais manhosa</span>
      <h3 style="margin-top:10px;font-size:18px;">${current.title}</h3>
      <p style="font-size:14px;line-height:1.5;">${current.desc}</p></div>`;
  } else if(next){
    const days = next.week*7 - nowDays;
    curCard.innerHTML = `<div class="card"><h3>Próximo salto</h3>
      <p style="font-size:14px;">Em cerca de <b>${days} dia(s)</b>, por volta da semana ${next.week}: <b>${next.title}</b></p>
      <div class="tip">${next.desc}</div></div>`;
  } else {
    curCard.innerHTML = `<div class="card"><h3>Saltos de desenvolvimento</h3><p style="font-size:14px;color:var(--muted);">Ana já passou pelos 10 saltos clássicos dos primeiros ~18 meses. 🎉</p></div>`;
  }
  curCard.insertAdjacentHTML('beforeend', `<div class="card">
    <h3>Ela não bate com essa previsão?</h3>
    <p style="font-size:13px;color:var(--muted);">${baby.leap_calibration_days ? `Ajuste atual: ${baby.leap_calibration_days>0?'saltos atrasados em '+baby.leap_calibration_days+' dia(s)':'saltos adiantados em '+Math.abs(baby.leap_calibration_days)+' dia(s)'}` : 'Sem ajuste manual.'}</p>
    <div class="leap-calib">
      <button class="btn secondary" style="margin-top:0;" id="leap-delay">⏪ Ainda não chegou (+7d)</button>
      <button class="btn secondary" style="margin-top:0;" id="leap-advance">⏩ Já passou (-7d)</button>
    </div>
  </div>`);
  $('#leap-delay').onclick = async ()=>{ await db.from('baby').update({leap_calibration_days:(baby.leap_calibration_days||0)+7}).eq('id',baby.id); await loadBaby(); await refreshAll(); };
  $('#leap-advance').onclick = async ()=>{ await db.from('baby').update({leap_calibration_days:(baby.leap_calibration_days||0)-7}).eq('id',baby.id); await loadBaby(); await refreshAll(); };

  const activeLeap = current || next;
  $('#leap-activities').innerHTML = activeLeap ? activeLeap.atividades.map(a=>`<div class="tip" style="margin-top:8px;">💡 ${a}</div>`).join('') : '<div class="empty">Sem sugestões no momento</div>';

  const leapNum = activeLeap ? activeLeap.n : null;
  const notesForLeap = leapNum ? state.leapNotes.filter(n=>n.leap_number===leapNum) : [];
  $('#leap-notes-list').innerHTML = notesForLeap.length ? notesForLeap.map(n=>`<div class="list-row"><div><div class="t1" style="font-size:13px;">${n.note}</div><div class="t2">${new Date(n.created_at).toLocaleDateString('pt-BR')} ${whoTag(n.logged_by)}</div></div></div>`).join('') : '<div class="empty">Nenhuma anotação ainda</div>';
  $('#leap-note-save').onclick = async ()=>{
    const val = $('#leap-note-input').value.trim();
    if(!val || !leapNum) return;
    await db.from('leap_notes').insert({baby_id:baby.id, leap_number:leapNum, note:val, logged_by:caregiver()});
    $('#leap-note-input').value='';
    await refreshAll();
  };

  $('#milestones-list').innerHTML = state.milestones.length ? state.milestones.map(m=>`
    <div class="list-row"><div><div class="t1">🏆 ${m.title}</div><div class="t2">${new Date(m.occurred_at+'T00:00:00').toLocaleDateString('pt-BR')} ${whoTag(m.logged_by)} ${m.notes?'· '+m.notes:''}</div>${m.photo_url?`<img class="photo-thumb" src="${m.photo_url}">`:''}</div>
    <button class="del" data-kind="milestone" data-id="${m.id}" style="background:none;border:none;color:var(--danger);font-size:18px;">✕</button></div>`).join('') : '<div class="empty">Nenhum marco registrado ainda</div>';
  document.querySelectorAll('[data-kind="milestone"]').forEach(btn=> btn.onclick = async ()=>{ if(confirm('Excluir?')){ await db.from('milestones').delete().eq('id',btn.dataset.id); await refreshAll(); } });
  $('#btn-add-milestone').onclick = openMilestoneSheet;

  $('#leap-list').innerHTML = LEAPS.map(l=>{
    const d = leapDate(l.week);
    const cls = nowDays >= l.week*7+5 ? 'past' : (activeLeap && activeLeap.n===l.n ? 'current' : '');
    return `<div class="leap-list-item ${cls}"><div class="dot"></div>
      <div class="txt"><div class="t1">Salto ${l.n} — ${l.title}</div><div class="t2">~ semana ${l.week} · ${d.toLocaleDateString('pt-BR')}</div></div>
    </div>`;
  }).join('');
}

    method:'POST',
    headers:{ 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`, 'apikey':SUPABASE_ANON_KEY, 'Content-Type':file.type },
    body:file
  });
  if(!res.ok) return null;
  return `${SUPABASE_URL}/storage/v1/object/public/baby-photos/${filename}`;
}

// ---------- handover summary ----------
function generateHandoverText(){
  const hours = 8;
  const since = new Date(Date.now()-hours*3600000).toISOString();
  const sleepMin = state.sleeps.filter(s=>s.start_time>=since).reduce((sum,s)=>sum+minsBetween(s.start_time, s.end_time||new Date()),0);
  const feeds = state.feedings.filter(f=>f.start_time>=since);
  const diapers = state.diapers.filter(d=>d.occurred_at>=since);
  const sleep = currentSleep();
  const lastFeed = state.feedings.find(f=>f.end_time || f.duration_minutes!=null);
  const lastDiaper = state.diapers[0];
  let lines = [];
  lines.push(`📋 Resumo de ${baby.name} — últimas ${hours}h`);
  lines.push(sleep ? `Está dormindo agora (desde ${fmtTime(sleep.start_time)}).` : `Está acordada.`);
  lines.push(`Sono total no período: ${fmtDur(sleepMin)}`);
  lines.push(`Mamadas: ${feeds.length}${lastFeed?' · última às '+fmtTime(lastFeed.end_time||lastFeed.start_time)+' ('+feedLabel(lastFeed.type)+')':''}`);
  lines.push(`Trocas de fralda: ${diapers.length}${lastDiaper?' · última às '+fmtTime(lastDiaper.occurred_at)+' ('+diaperLabel(lastDiaper.type)+')':''}`);
  const meds = state.medications.filter(m=>m.given_at>=since);
  if(meds.length) lines.push(`Remédios dados: ${meds.map(m=>m.name+' às '+fmtTime(m.given_at)).join(', ')}`);
  return lines.join('\n');
}
function openHandoverSheet(){
  const text = generateHandoverText();
  sheetShell('🤝 Resumo pra passar o plantão', `
    <div class="tip" style="white-space:pre-line;font-size:13px;">${text}</div>
    <button class="btn" id="handover-copy">📋 Copiar texto</button>
  `);
  $('#handover-copy').onclick = async ()=>{
    try{ await navigator.clipboard.writeText(text); showToast('Copiado ✓'); }
    catch(e){ alert('Não consegui copiar automaticamente — seleciona o texto manualmente.'); }
  };
}

// ---------- CSV export ----------
function exportCsv(){
  const rows = [['tipo','data','hora','detalhes','duracao_min','quem']];
  allEventsSorted().forEach(it=>{
    const d = it.data;
    const dt = new Date(it.time);
    let detalhes='', dur='';
    if(it.kind==='diaper'){ detalhes = diaperLabel(d.type)+(d.consistency?' '+d.consistency:'')+(d.color?' '+d.color:''); }
    else if(it.kind==='sleep'){ detalhes = d.type; dur = d.end_time?minsBetween(d.start_time,d.end_time):''; }
    else if(it.kind==='feeding'){ detalhes = feedLabel(d.type)+(d.amount_ml?' '+d.amount_ml+'ml':''); dur = d.duration_minutes||''; }
    else if(it.kind==='activity'){ detalhes = d.description; }
    rows.push([it.kind, fmtDateInput(dt), fmtTime(dt), detalhes, dur, d.logged_by||'']);
  });
  const csv = rows.map(r=> r.map(c=> `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `rotina-${baby.name.toLowerCase()}-${fmtDateInput(new Date())}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// ---------- PDF export ----------
function exportPdf(){
  if(typeof window.jspdf === 'undefined'){ alert('Ferramenta de PDF ainda carregando, tenta de novo em alguns segundos.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 15;
  doc.setFontSize(16); doc.text(`Resumo de rotina — ${baby.name}`, 14, y); y+=8;
  doc.setFontSize(10); doc.text(`Idade: ${ageInfo(baby.birth_date).label} · Gerado em ${new Date().toLocaleDateString('pt-BR')}`, 14, y); y+=10;

  const last = state.growth[state.growth.length-1];
  if(last){
    doc.setFontSize(12); doc.text('Última medida:', 14, y); y+=6;
    doc.setFontSize(10);
    doc.text(`Peso: ${last.weight_kg||'-'} kg · Altura: ${last.height_cm||'-'} cm · PC: ${last.head_circumference_cm||'-'} cm (${new Date(last.measured_at+'T00:00:00').toLocaleDateString('pt-BR')})`, 14, y); y+=10;
  }

  doc.setFontSize(12); doc.text('Últimos 7 dias — resumo de sono e alimentação:', 14, y); y+=7;
  doc.setFontSize(9);
  for(let i=6;i>=0;i--){
    const d = new Date(Date.now()-i*86400000);
    const [s,e] = dayRange(d);
    const sleepMin = state.sleeps.filter(sl=>sl.start_time>=s && sl.start_time<=e).reduce((sum,sl)=>sum+minsBetween(sl.start_time, sl.end_time||new Date()),0);
    const feeds = state.feedings.filter(f=>f.start_time>=s && f.start_time<=e).length;
    const diapers = state.diapers.filter(dd=>dd.occurred_at>=s && dd.occurred_at<=e).length;
    doc.text(`${d.toLocaleDateString('pt-BR')}: sono ${fmtDur(sleepMin)} · ${feeds} mamada(s) · ${diapers} troca(s) de fralda`, 14, y); y+=6;
  }
  y+=6;

  if(state.vaccinations.length){
    doc.setFontSize(12); doc.text('Vacinas aplicadas:', 14, y); y+=7;
    doc.setFontSize(9);
    state.vaccinations.filter(v=>v.applied_at).forEach(v=>{ doc.text(`${v.vaccine_name} — ${new Date(v.applied_at+'T00:00:00').toLocaleDateString('pt-BR')}`, 14, y); y+=5.5; if(y>280){doc.addPage();y=15;} });
  }

  doc.save(`rotina-${baby.name.toLowerCase()}-${fmtDateInput(new Date())}.pdf`);
}

// ---------- tabs ----------
function showTab(name){
  state.activeTab = name;
  document.querySelectorAll('.tabcontent').forEach(el=>el.classList.add('hidden'));
  $('#tab-'+name).classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  renderActive();
}
function renderActive(){
  if(state.activeTab==='home') renderHome();
  else if(state.activeTab==='historico') renderHistorico();
  else if(state.activeTab==='sono') renderSono();
  else if(state.activeTab==='saude') renderSaude();
  else if(state.activeTab==='dev') renderDev();
}

document.querySelectorAll('.tab').forEach(b=> b.onclick = ()=> showTab(b.dataset.tab));
$('#hist-prev').onclick = ()=>{ state.histDate = new Date(state.histDate.getTime()-86400000); renderHistorico(); };
$('#hist-next').onclick = ()=>{ state.histDate = new Date(state.histDate.getTime()+86400000); renderHistorico(); };
$('#open-settings').onclick = openSettingsSheet;
$('#btn-export-pdf').onclick = exportPdf;
$('#btn-export-csv').onclick = exportCsv;
$('#btn-handover').onclick = openHandoverSheet;
document.querySelectorAll('#saude-subtabs .subtab').forEach(b=> b.onclick = ()=>{ state.activeSaudeSub = b.dataset.sub; renderSaude(); });
document.querySelectorAll('#ob-who .opt-btn').forEach(b=> b.onclick=()=>{ document.querySelectorAll('#ob-who .opt-btn').forEach(x=>x.classList.toggle('selected',x===b)); });

// ---------- refresh / realtime ----------
async function refreshAll(){
  await loadAll();
  renderHeader();
  renderActive();
}

async function init(){
  applyDarkModeOverride();
  setInterval(applyDarkModeOverride, 5*60000);
  await loadBaby();
  if(!baby){
    $('#onboarding').classList.remove('hidden');
    $('#ob-birth').valueAsDate = new Date();
    $('#ob-save').onclick = async ()=>{
      const name = $('#ob-name').value.trim() || 'Bebê';
      const birth = $('#ob-birth').value;
      if(!birth) return alert('Selecione a data de nascimento');
      const who = document.querySelector('#ob-who .opt-btn.selected');
      localStorage.setItem('caregiverName', who ? who.dataset.v : 'Mamãe');
      const gestweeks = $('#ob-gestweeks').value || null;
      const {data} = await db.from('baby').insert({name, birth_date:birth, gestational_weeks_at_birth:gestweeks}).select();
      baby = data[0];
      $('#onboarding').classList.add('hidden');
      startApp();
    };
    return;
  }
  startApp();
}

async function startApp(){
  $('#app').classList.remove('hidden');
  $('#tabbar').classList.remove('hidden');
  renderHeader();
  await refreshAll();

  if(state.liveTick) clearInterval(state.liveTick);
  state.liveTick = setInterval(()=>{ if(state.activeTab==='home') renderHome(); }, 30000);

  const tables = ['diaper_changes','sleep_sessions','feedings','activities','growth_measurements','milestones','vaccinations','medications','pumping_sessions','milk_stash','leap_notes','appointments','daily_mood'];
  let channel = db.channel('rotina-changes');
  tables.forEach(t=> channel = channel.on('postgres_changes', {event:'*', schema:'public', table:t, filter:`baby_id=eq.${baby.id}`}, refreshAll));
  channel.subscribe();
}

init();
</script>
